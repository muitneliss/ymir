include:
  - "*.md"
  - "docs/**/*.md"
  - "plugins/ymir/SKILL.md"
  - "plugins/ymir/references/*.md"
  - "plugins/ymir/templates/**/*.md"
  - "wiki/SCHEMA.md"
exclude:
  - pattern: "CHANGELOG.md"
    reason: "Auto-generated by release-please — not authored documentation"
  - pattern: "benchmarks/**"
    reason: "Benchmark analysis reports, not design rationale or reference docs"
  - pattern: "wiki-cli/src/templates/**"
    reason: "CLI scaffold fixtures baked into the binary — not authored documentation"
